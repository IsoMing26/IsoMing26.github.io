<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>strata</title>
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/camera.css">
    </head>
    <body>
    
        <div class="main_container">

            <div class="viewfinder_area">
                <div class="progress_indicator">1/4</div>
                <video id="camera_feed" autoplay playsinline></video>
                <canvas id="overlay"></canvas>
            </div>

            <div class="controls">
                <button class="shutter_button"></button>
                <button class="gallery_button" onclick="location.href='gallery.html'"></button>
            </div>
        </div>

    <div class="completion_screen" style="display: none;">

        <div class="progress_indicator">4/4</div>
    
        <div class="final_container">
            <canvas id="final_composite"></canvas>
        
            <div class="metadata">
                <p class="time_elapsed">Time: 00:00:00</p>
                <p class="distance_traveled">Traveled 0 KM</p>
            </div>
        
            <div class="final_controls">
                <button class="download_button">↓</button>
                <button class="new_button" onclick="location.href='gallery.html'">+</button>
            </div>
        </div>
    </div>

      <script src="js/shape.js"></script>
      <script src="js/camera.js"></script>
    </body>
</html>
